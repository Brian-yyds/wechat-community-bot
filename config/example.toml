# 协议自报：第一阶段仅本地模拟，未接入真实微信协议。详见 docs/PROTOCOL_RISK.md
[wechat]
protocol = "mock"
protocol_type = "mock"
# 读取与发送可分开配置，例如 inbound=local_capture + outbound=mock/uia。
# 默认仍为 mock，便于演示；A 读 + B 发时 inbound="local_capture"、outbound="uia"。
inbound = "mock"
outbound = "mock"
# inbound = "notification"  # C，非全量，见 docs/ADAPTER_C.md
# outbound = "ocr"          # D，降级发送，见 docs/ADAPTER_D.md

# 适配器 A：个人微信本地库只读增量抓取。密钥不要写在本文件，使用环境变量
# WECHAT_LOCAL_DB_KEY / WECHAT_LOCAL_DB_KEY_FILE，或事先准备已解密的 SQLite 副本。
# 真实 4.x 表结构须在用户 Windows 上用 scripts/selfcheck_local_capture.py 验证。
[inbound.local_capture]
db_path = ""
cursor_path = "data/local_capture_cursor.json"
# 默认约 1 秒轮询，带 ±0.1 秒抖动，使增量检出延迟尽量 <1s。
poll_interval_seconds = 1.0
poll_jitter_seconds = 0.1
poll_timeout = 2.0
lock_retries = 10
lock_retry_delay_seconds = 0.03
# 只抓交易会员群白名单；全量抓取不依赖会话是否打开、是否免打扰或折叠。
group_whitelist = ["demo-group"]
# self_ids 也可沿用 [bot.identity]；用于给自己发出的消息打 is_self 标记。
# require_key = false  # 明文/已解密库无需密钥；加密模式且未配置密钥会报清晰错误。

[inbound.local_capture.schema]
# 默认对齐本仓库模拟库。真实微信 4.x 的表名/列名请按自检结果修改。
messages_table = "messages"
groups_table = "chatrooms"
contacts_table = "contacts"
msg_id_col = "msg_id"
group_id_col = "group_id"
sender_id_col = "sender_id"
sender_name_col = "sender_name"
timestamp_col = "ts"
content_col = "content"
seq_col = "create_seq"
msg_type_col = "msg_type"
group_pk_col = "wxid"
group_name_col = "name"


# 适配器 B：官方 PC 微信 UIA 发送。仅在用户 Windows 电脑把 wechat.outbound 改为 "uia"。
# box 上请保持 outbound=mock，或使用 FakeUiDriver 模拟。详见 docs/ADAPTER_B.md。
# 紧急暂停与 D 共用 data/PAUSE（或环境变量 WECHAT_BOT_PAUSE_FILE）。
[outbound.uia]
pause_flag = "data/PAUSE"
max_retries = 2
send_timeout_seconds = 8.0
input_pause_min = 0.12
input_pause_max = 0.35
group_switch_interval_min = 0.35
group_switch_interval_max = 0.70
min_send_interval_seconds = 0.80
keep_chat_open = true
preheat_on_start = true
preheat_groups = ["demo-group"]
return_to_primary_after_send = true
reopen_min_interval_seconds = 30
primary_group = "demo-group"
target_open_chat_seconds = 3.0
target_unopened_chat_seconds = 8.0

[outbound.uia.group_names]
demo-group = "交易会员群演示"


# 适配器 C：通知 / 会话列表预览，只能作唤醒辅助，不能全量抓取。见 docs/ADAPTER_C.md。
# 当 inbound 使用 local_capture 时，把 enabled 设为 true 可在有预览时催促 A 立即轮询。
[inbound.notification]
enabled = false
source = "fake"              # fake（box 测试）或 windows（未验证骨架）
poll_interval_seconds = 1.0
suppressed_groups = []
wake_a_on_preview = true   # 设为 false 时不会自动把唤醒钩子接到 A
# from_config 默认开启本轮唤醒预算与按群合并，避免通知洪泛打满 A
wake_budget_per_poll = 20
merge_wake_by_group = true

# 适配器 D：OCR 降级发送，仅为 UIA 失效时的备选，延迟可能十余秒。见 docs/ADAPTER_D.md。
# box 上请保持 driver=fake，并保持 dry_run=true。紧急暂停与 B 共用 data/PAUSE。
[outbound.ocr]
driver = "fake"              # fake（box 测试）或 windows（未验证骨架）
engine = "tesseract"         # tesseract 或 rapidocr（仅 windows 驱动）
dry_run = true
confirm_group_name = true
input_pause_min = 0.4
input_pause_max = 1.2
idempotency_window_seconds = 600
# 经 HumanizedSender 发送时保持 false，避免令牌被扣两次。
# 即使为 false，适配器仍会执行每小时上限（默认 40，或沿用 rate_limit.global_replies_per_hour）。
enforce_rate_limit = false
# global_replies_per_hour = 40
# pause_file = "data/PAUSE"

# 示例配置（可直接用于演示）。真实密钥与本地覆盖请使用 config/local.toml（已 gitignore）。
# 本项目严禁配置任何博彩 / 六合彩 / 下注 / 结算 / 收款相关规则或文案。

[bot]
data_dir = "data"

[bot.identity]
# 填写本小号的 wxid / 群内昵称，避免回复自己发出的消息。
self_ids = []
self_names = ["交易助手"]
bot_ids = []
bot_names = []

[logging]
level = "INFO"

# 运行模式：改这一行即可切换。
# observe=只读不发（默认） / announce=只发定时公告 / reply=自动回复+公告
# 紧急暂停：在数据目录放置 PAUSE 文件后，任何发送都不会执行（与适配器 B/D 约定一致）。
[run]
mode = "observe"

[pipeline]
dedup_window_seconds = 600
jsonl_path = "data/records.jsonl"
# qa_file = "config/qa_example.json"  # 也可把问答库拆到独立文件

[rate_limit]
# 全局每小时自动回复上限默认 40；单群与每分钟上限、拟人延迟、夜间静默均可配。
global_replies_per_hour = 40
group_replies_per_hour = 20
global_per_minute = 8
group_per_minute = 3
send_delay_min = 2.0
send_delay_max = 6.0
typing_hook = true
typing_duration_min = 0.3
typing_duration_max = 1.0
max_rate_wait_seconds = 30

[rate_limit.global]
capacity = 8
refill_per_second = 0.25

[rate_limit.per_group]
capacity = 3
refill_per_second = 0.1

[rate_limit.quotas.announcement]
capacity = 4
refill_per_second = 0.1

[rate_limit.quotas.auto_reply]
capacity = 6
refill_per_second = 0.2

[rate_limit.night_silent]
# 默认开启；静默期内不主动发公告（暂存），自动回复直接丢弃、不排队补发。
enabled = true
start = "00:30"
end = "07:00"
announcement_policy = "hold"
auto_reply_policy = "drop"

[[groups]]
group_id = "demo-group"
name = "交易会员群演示"

[[announcements]]
id = "morning_hello"
text = "各位会员早上好。请注意风险控制，有问题直接在群内提问。本提醒不构成投资建议。"
groups = ["demo-group"]
schedule = "09:00"
jitter_seconds = 3
catch_up = true
catch_up_max_minutes = 10
enabled = true

[[replies]]
id = "greeting"
priority = 100
keywords = ["你好", "在吗", "大家好"]
reply = "您好，我是群助手。有问题请直接在群里提问，请注意风险自担。"
cooldown_seconds = 120
groups = ["*"]
enabled = true

[[replies]]
id = "risk"
priority = 80
keywords = ["风险", "止损"]
reply = "市场有风险，决策需谨慎。本群只做信息整理与提醒，不构成投资建议。"
cooldown_seconds = 180
groups = ["*"]
enabled = true

[[replies]]
id = "howto_ask"
priority = 50
pattern = "怎么看|如何理解"
reply = "可以在群里补充你关注的标的与时间范围，管理员或同伴看到会一起讨论。请注意风险自担。"
cooldown_seconds = 180
groups = ["*"]
enabled = true

[pipeline.storm]
group_burst_max = 5
group_window_seconds = 60
group_cool_seconds = 180
global_burst_max = 15
global_window_seconds = 60
global_cool_seconds = 180
