# 示例配置的 YAML 版本（读取需要 pyyaml）。真实配置请用 config/local.yaml。
# 严禁配置任何博彩 / 六合彩 / 下注 / 结算 / 收款相关规则或文案。

wechat:
  protocol: mock
  protocol_type: mock
  # A 读 + B 发时 inbound: local_capture，outbound: uia
  inbound: mock
  outbound: mock

# 适配器 A：本地库只读抓取。密钥不要写在本文件。
# 使用环境变量 WECHAT_LOCAL_DB_KEY / WECHAT_LOCAL_DB_KEY_FILE，或已解密 SQLite 副本。
# 真实表结构须在用户 Windows 上用 scripts/selfcheck_local_capture.py 验证。
inbound:
  local_capture:
    db_path: ""
    cursor_path: data/local_capture_cursor.json
    poll_interval_seconds: 1.0
    poll_jitter_seconds: 0.1
    poll_timeout: 2.0
    lock_retries: 10
    lock_retry_delay_seconds: 0.03
    group_whitelist: [demo-group]
    schema:
      messages_table: messages
      groups_table: chatrooms
      contacts_table: contacts
      msg_id_col: msg_id
      group_id_col: group_id
      sender_id_col: sender_id
      sender_name_col: sender_name
      timestamp_col: ts
      content_col: content
      seq_col: create_seq
      msg_type_col: msg_type
      group_pk_col: wxid
      group_name_col: name
  # C 通知预览旁路。enabled=true 时催促 A 立即轮询。见 docs/ADAPTER_C.md。
  notification:
    enabled: false
    source: fake
    poll_interval_seconds: 1.0
    suppressed_groups: []
    wake_a_on_preview: true
    wake_budget_per_poll: 20
    merge_wake_by_group: true

# 适配器 B：官方 PC 微信 UIA 发送。仅在用户 Windows 把 wechat.outbound 改为 uia。
# 紧急暂停与 D 共用 data/PAUSE。详见 docs/ADAPTER_B.md。
outbound:
  uia:
    pause_flag: data/PAUSE
    max_retries: 2
    send_timeout_seconds: 8.0
    input_pause_min: 0.12
    input_pause_max: 0.35
    group_switch_interval_min: 0.35
    group_switch_interval_max: 0.70
    min_send_interval_seconds: 0.80
    keep_chat_open: true
    preheat_on_start: true
    preheat_groups: [demo-group]
    return_to_primary_after_send: true
    reopen_min_interval_seconds: 30
    primary_group: demo-group
    target_open_chat_seconds: 3.0
    target_unopened_chat_seconds: 8.0
    group_names:
      demo-group: 交易会员群演示
  # D OCR 降级发送。box 上保持 fake + dry_run。见 docs/ADAPTER_D.md。
  ocr:
    driver: fake
    engine: tesseract
    dry_run: true
    confirm_group_name: true
    input_pause_min: 0.4
    input_pause_max: 1.2
    idempotency_window_seconds: 600
    enforce_rate_limit: false

bot:
  data_dir: data
  identity:
    self_ids: []
    self_names: [交易助手]
    bot_ids: []
    bot_names: []

logging:
  level: INFO

# 运行模式：改这一行即可切换。observe / announce / reply。默认 observe。
# 配置里显式写出的 mode 优先于 data/run_mode.json；运行中切换会写入该状态文件。
# 紧急暂停：在数据目录放置 PAUSE 文件后，任何发送都不会执行。
run:
  mode: observe

pipeline:
  dedup_window_seconds: 600
  jsonl_path: data/records.jsonl
  storm:
    group_burst_max: 5
    group_window_seconds: 60
    group_cool_seconds: 180
    global_burst_max: 15
    global_window_seconds: 60
    global_cool_seconds: 180

rate_limit:
  global_replies_per_hour: 40
  group_replies_per_hour: 20
  global_per_minute: 8
  group_per_minute: 3
  # 其余/未打开会话：2–6s（8s 目标）。打开会话规则回复：1.5–2.4s（3s 目标，下限默认 ≥1.5，可配）。
  send_delay_min: 2.0
  send_delay_max: 6.0
  open_session_delay_min: 1.5
  open_session_delay_max: 2.4
  announcement_delay_min: 2.0
  announcement_delay_max: 6.0
  typing_hook: true
  typing_duration_min: 0.3
  typing_duration_max: 1.0
  max_rate_wait_seconds: 30
  global:
    capacity: 8
    refill_per_second: 0.25
  per_group:
    capacity: 3
    refill_per_second: 0.1
  quotas:
    announcement:
      capacity: 4
      refill_per_second: 0.1
    auto_reply:
      capacity: 6
      refill_per_second: 0.2
  night_silent:
    enabled: true
    start: "00:30"
    end: "07:00"
    announcement_policy: hold
    auto_reply_policy: drop

groups:
  - group_id: demo-group
    name: 交易会员群演示

announcements:
  - id: morning_hello
    text: 各位会员早上好。请注意风险控制，有问题直接在群内提问。本提醒不构成投资建议。
    groups: [demo-group]
    schedule: "09:00"
    jitter_seconds: 3
    catch_up: true
    catch_up_max_minutes: 10
    enabled: true

replies:
  - id: greeting
    priority: 100
    keywords: [你好, 在吗, 大家好]
    reply: 您好，我是群助手。有问题请直接在群里提问，请注意风险自担。
    cooldown_seconds: 120
    groups: ["*"]
    enabled: true
  - id: risk
    priority: 80
    keywords: [风险, 止损]
    reply: 市场有风险，决策需谨慎。本群只做信息整理与提醒，不构成投资建议。
    cooldown_seconds: 180
    groups: ["*"]
    enabled: true
  - id: howto_ask
    priority: 50
    pattern: 怎么看|如何理解
    reply: 可以在群里补充你关注的标的与时间范围，管理员或同伴看到会一起讨论。请注意风险自担。
    cooldown_seconds: 180
    groups: ["*"]
    enabled: true

